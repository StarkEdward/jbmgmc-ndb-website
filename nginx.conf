user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression Configuration
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Limits
    client_max_body_size 10M; # Support large image and PDF uploads in admin panel
    server_tokens off;        # Do not reveal nginx version in error pages and headers

    # ─── HTTP SERVER (Default) ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name jbmgmc-nandurbar.edu.in www.jbmgmc-nandurbar.edu.in localhost;

        # ACME challenge for Let's Encrypt certificate renewal (must stay on HTTP)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Dynamic health check route bypass / telemetry metrics
        location /api/health {
            proxy_pass http://localhost:3000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            access_log off; # Keep access logs clean from monitoring polls
        }

        # Next.js Static Files Cache Control (Static / Public Folder)
        location /_next/static/ {
            proxy_pass http://localhost:3000/_next/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            access_log off;
        }

        # Main App Proxy
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # AFTER INSTALLING SSL (Certbot), UNCOMMENT THE REDIRECT BELOW:
        # location / {
        #     return 301 https://$host$request_uri;
        # }
    }

