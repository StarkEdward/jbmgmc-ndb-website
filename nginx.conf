user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression Configuration
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Limits
    client_max_body_size 10M; # Support large image and PDF uploads in admin panel
    server_tokens off;        # Do not reveal nginx version in error pages and headers

    # ─── HTTP SERVER — Redirect all traffic to HTTPS (VULN-07 fix) ──────────────
    server {
        listen 80;
        server_name jbmgmc-nandurbar.edu.in www.jbmgmc-nandurbar.edu.in;

        # ACME challenge for Let's Encrypt certificate renewal (must stay on HTTP)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS SERVER ────────────────────────────────────────────────────────────
    # To obtain certificates (run ONCE on the server):
    #   sudo certbot certonly --webroot -w /var/www/certbot \
    #       -d jbmgmc-nandurbar.edu.in -d www.jbmgmc-nandurbar.edu.in
    # Certificates will be placed at:
    #   /etc/letsencrypt/live/jbmgmc-nandurbar.edu.in/fullchain.pem
    #   /etc/letsencrypt/live/jbmgmc-nandurbar.edu.in/privkey.pem
    server {
        listen 443 ssl;
        http2 on;
        server_name jbmgmc-nandurbar.edu.in www.jbmgmc-nandurbar.edu.in;

        # SSL Certificate (Let's Encrypt via Certbot)
        ssl_certificate     /etc/letsencrypt/live/jbmgmc-nandurbar.edu.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jbmgmc-nandurbar.edu.in/privkey.pem;

        # TLS Protocol & Cipher Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off; # Let clients negotiate best cipher (TLS 1.3 handles this)

        # SSL Session Cache (improves performance for repeat visitors)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off; # Disable for forward secrecy

        # OCSP Stapling (speeds up certificate validation for clients)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security Headers (HSTS — tell browsers to always use HTTPS for 2 years)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 10M;

        # Dynamic health check route bypass / telemetry metrics
        location /api/health {
            proxy_pass http://localhost:3000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            access_log off; # Keep access logs clean from monitoring polls
        }

        # Next.js Static Files Cache Control (Static / Public Folder)
        location /_next/static/ {
            proxy_pass http://localhost:3000/_next/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            access_log off;
        }

        # Main App Proxy
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
