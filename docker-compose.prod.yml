version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jbmgmc-website
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./server-storage/data:/app/data
      - ./server-storage/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://jbmgmc-nandurbar.edu.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

